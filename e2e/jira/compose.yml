services:
  postgres:
    image: ${JIRA_E2E_POSTGRES_IMAGE:?Run the Jira harness}
    platform: linux/amd64
    environment:
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira-e2e
      POSTGRES_DB: jira
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U jira -d jira]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: "no"
  jira:
    image: ${JIRA_E2E_JIRA_IMAGE:?Run the Jira harness}
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
    environment:
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/jira
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: jira-e2e
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      ATL_FORCE_CFG_UPDATE: "true"
      CLUSTERED: "false"
      JVM_MINIMUM_MEMORY: 1g
      JVM_MAXIMUM_MEMORY: 2g
      JVM_SUPPORT_RECOMMENDED_ARGS: -Djava.awt.headless=true -Datlassian.mail.senddisabled=true -Datlassian.mail.fetchdisabled=true
    volumes:
      - jira-home:/var/atlassian/application-data/jira
    stop_grace_period: 3m
    restart: "no"
volumes:
  jira-home:
  postgres-data:
