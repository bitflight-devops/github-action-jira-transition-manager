name: Code Linting
on: [pull_request]
permissions:
  contents: read
jobs:
  biome:
    name: runner / biome
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
