name: Verify Jira fixture lifecycle

on:
  pull_request:
    paths:
      - 'e2e/jira/**'
      - '.github/workflows/build-e2e-snapshots.yml'
  push:
    branches: [main]
    paths:
      - 'e2e/jira/**'
      - '.github/workflows/build-e2e-snapshots.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold:
    name: Cold setup and fresh-volume round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      fixture-key: ${{ steps.jira.outputs.fixture-key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - name: Prepare, save, restore, and verify Jira
        id: jira
        uses: ./e2e/jira
        with:
          mode: cold
      - name: Verify cold path was exercised
        env:
          SOURCE: ${{ steps.jira.outputs.fixture-source }}
        run: test "$SOURCE" = cold
      - name: Collect diagnostics
        if: failure() && env.JIRA_E2E_HARNESS != ''
        run: node "$JIRA_E2E_HARNESS" logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: jira-cold-diagnostics
          path: ${{ runner.temp }}/jira-e2e/artifacts
          retention-days: 7
      - name: Remove disposable environment
        if: always() && env.JIRA_E2E_HARNESS != ''
        run: node "$JIRA_E2E_HARNESS" down

  cached:
    name: Restore saved cache on a fresh runner
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - name: Require the exact producer fixture
        id: jira
        uses: ./e2e/jira
        with:
          mode: restore
          fixture-key: ${{ needs.cold.outputs.fixture-key }}
      - name: Verify the cache path was exercised
        env:
          SOURCE: ${{ steps.jira.outputs.fixture-source }}
        run: test "$SOURCE" = cache
      - name: Collect diagnostics
        if: failure() && env.JIRA_E2E_HARNESS != ''
        run: node "$JIRA_E2E_HARNESS" logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: jira-cached-diagnostics
          path: ${{ runner.temp }}/jira-e2e/artifacts
          retention-days: 7
      - name: Remove disposable environment
        if: always() && env.JIRA_E2E_HARNESS != ''
        run: node "$JIRA_E2E_HARNESS" down
